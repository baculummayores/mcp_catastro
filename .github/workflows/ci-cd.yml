name: 🧪 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.14"

jobs:
  # Linting y formato
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.9.7"
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Verify and sync locked dependencies
      run: |
        uv lock --check
        uv sync --locked --only-group dev
    
    - name: Check format with Black
      run: uv run --locked black --check mcp_server.py config models services tests/test_mcp_v2.py tests/test_logging_privacy.py
    
    - name: Check imports with isort
      run: uv run --locked isort --check-only mcp_server.py config models services tests/test_mcp_v2.py tests/test_logging_privacy.py
    
    - name: Lint with flake8
      run: uv run --locked flake8 mcp_server.py config models services tests/test_mcp_v2.py tests/test_logging_privacy.py --max-line-length=100 --extend-ignore=E203,W503,E501,W291,W293

  # Tests unitarios
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.9.7"
    
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Sync locked dependencies
      run: uv sync --locked --all-extras --dev
    
    - name: Run tests with coverage
      run: |
        uv run --locked pytest tests/ -v --cov=services --cov=models --cov=mcp_server --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # Security scan
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.9.7"
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Sync locked dependencies
      run: uv sync --locked --all-groups --all-extras
    
    - name: Security scan with Safety
      run: uv run --locked --all-groups --all-extras safety check
    
    - name: Security scan with Bandit
      run: uv run --locked --all-groups --all-extras bandit -r . -f json -o bandit-report.json || true
    
    - name: Upload security scan results
      uses: actions/upload-artifact@v3
      with:
        name: security-scan
        path: bandit-report.json

  # Notificación de resultados
  notify:
    name: 📢 Notify Results
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: always()
    
    steps:
    - name: Notify success
      if: ${{ needs.lint.result == 'success' && needs.test.result == 'success' && needs.security.result == 'success' }}
      run: |
        echo "✅ Pipeline completed successfully!"
    
    - name: Notify failure
      if: ${{ needs.lint.result == 'failure' || needs.test.result == 'failure' || needs.security.result == 'failure' }}
      run: |
        echo "❌ Pipeline failed!"
        exit 1
