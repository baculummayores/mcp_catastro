name: 🧪 CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.14"

jobs:
  # Linting y formato
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.7"
    
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Verify and sync locked dependencies
      run: |
        uv lock --check
        uv sync --locked --only-group dev
    
    - name: Check format with Black
      run: uv run --locked black --check mcp_server.py smoke_catastro.py config models services tests/test_*.py
    
    - name: Check imports with isort
      run: uv run --locked isort --check-only mcp_server.py smoke_catastro.py config models services tests/test_*.py
    
    - name: Lint with flake8
      run: uv run --locked flake8 mcp_server.py smoke_catastro.py config models services tests/test_*.py --max-line-length=100 --extend-ignore=E203,W503,E501,W291,W293

  # Tests unitarios
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.7"
    
    - name: Set up Python 3.14
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Sync locked dependencies
      run: uv sync --locked --all-extras --dev
    
    - name: Run tests with coverage
      run: |
        uv run --locked pytest tests/ -v --cov=services --cov=models --cov=mcp_server --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # Security scan
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.7"
    
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Sync locked dependencies
      run: uv sync --locked --all-groups --all-extras
    
    - name: Audit locked dependencies
      run: |
        uv export --locked --all-extras --all-groups --no-emit-project --no-hashes --format requirements-txt --output-file /tmp/catastro-requirements.txt
        uv run --locked --all-groups --all-extras pip-audit --disable-pip --no-deps -r /tmp/catastro-requirements.txt
    
    - name: Security scan with Bandit
      run: uv run --locked --all-groups --all-extras bandit -r mcp_server.py config models services -f json -o bandit-report.json
    
    - name: Upload security scan results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: security-scan
        path: bandit-report.json

  # Notificación de resultados
  notify:
    name: 📢 Notify Results
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: always()
    
    steps:
    - name: Notify success
      if: ${{ needs.lint.result == 'success' && needs.test.result == 'success' && needs.security.result == 'success' }}
      run: |
        echo "✅ Pipeline completed successfully!"
    
    - name: Notify failure
      if: ${{ needs.lint.result == 'failure' || needs.test.result == 'failure' || needs.security.result == 'failure' }}
      run: |
        echo "❌ Pipeline failed!"
        exit 1
