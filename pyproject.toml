[project]
name = "mcp-catastro"
version = "2.0.0"
description = "Servidor MCP para consultar el Catastro de España"
requires-python = ">=3.14,<3.15"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "httpx>=0.28.1,<1",
    "mcp>=2.3.0,<3",
    "pydantic>=2.14.3,<3",
    "python-dotenv>=1.2.4,<2",
]

[project.optional-dependencies]
openai = ["openai>=3.49.0,<4"]

[dependency-groups]
dev = [
    "black>=26.10.1,<27",
    "flake8>=7.5.0,<8",
    "isort>=9.0.2,<10",
    "pytest>=9.2.0,<10",
    "pytest-asyncio>=1.4.1.post1,<2",
    "pytest-cov>=7.1.0,<8",
]
security = [
    "bandit>=1.9.4,<2",
    "pip-audit>=2.10.1,<3",
]

[tool.uv]
package = false
required-version = ">=0.13.7"

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
